<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      Best AI Tools for Coding, Writing, Design & Productivity | AI Tools Hub

    <meta
      name="description"
      content="Discover the best AI tools for coding, writing, research, image generation, video creation, business, and productivity. Explore and find the right AI tool for your needs."

    />
    <meta name="author" content="AI Tools Hub" />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://yourdomain.com/" />

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <meta name="theme-color" content="#2563eb" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Best AI Tools for Coding, Writing, Design & Productivity | AI Tools Hub"
    />
    <meta
      property="og:description"
      content="Explore the best AI tools for coding, writing, research, image generation, video creation, business, and productivity."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="AI Tools Hub" />
    <meta property="og:image" content="https://yourdomain.com/og-image.jpg" />
    <meta
      property="og:image:alt"
      content="AI Tools Hub - Discover the best AI tools"
    />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Best AI Tools for Coding, Writing, Design & Productivity | AI Tools Hub"
    />
    <meta
      name="twitter:description"
      content="Discover useful AI tools for coding, writing, research, design, video, business, and productivity."
    />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.jpg" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      .hover-scale {
        transition: transform 0.3s ease;
      }
      .hover-scale:hover {
        transform: scale(1.05);
      }
      .loader {
        width: 40px;
        height: 40px;
        border: 4px solid #000;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body class="bg-gray-100 text-gray-800">
    <!-- Header -->
    <header class="bg-black text-white p-4">
      <nav class="flex justify-between items-center max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold">AI Tools Hub</h1>

        <button
          id="darkToggle"
          aria-label="Toggle Dark Mode"
          class="bg-gray-700 px-3 py-2 rounded-full hover:bg-gray-600 transition"
        >
          🌙
        </button>
      </nav>
    </header>

    <main>
      <!-- Hero Section -->
      <section
        class="text-center py-12 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4"
      >
        <h2 class="text-4xl sm:text-5xl md:text-6xl font-extrabold mb-4">
          Discover the Best AI Tools
        </h2>

        <p class="text-base sm:text-lg max-w-2xl mx-auto">
          Explore powerful AI tools for coding, writing, design, productivity,
          and more.
        </p>

        <!-- Filters -->
        <div class="flex flex-wrap gap-3 justify-center mt-8 text-black">
          <button
            class="filter-btn bg-white px-4 py-2 rounded-full"
            data-category="all"
          >
            All
          </button>
          <button
            class="filter-btn bg-white px-4 py-2 rounded-full"
            data-category="general"
          >
            General AI
          </button>
          <button
            class="filter-btn bg-white px-4 py-2 rounded-full"
            data-category="writing"
          >
            Writing
          </button>
          <button
            class="filter-btn bg-white px-4 py-2 rounded-full"
            data-category="coding"
          >
            Coding
          </button>
          <button
            class="filter-btn bg-white px-4 py-2 rounded-full"
            data-category="image"
          >
            Image
          </button>
          <button
            class="filter-btn bg-white px-4 py-2 rounded-full"
            data-category="video"
          >
            Video
          </button>
          <button
            class="filter-btn bg-white px-4 py-2 rounded-full"
            data-category="research"
          >
            Research
          </button>
          <button
            class="filter-btn bg-white px-4 py-2 rounded-full"
            data-category="business"
          >
            Business
          </button>
        </div>
      </section>

      <!-- Content Wrapper -->
      <section class="relative">
        <!-- Loader -->
        <div class="flex justify-center items-center" id="loaderWrapper">
          <span class="loader" id="loader"></span>
        </div>

        <!-- Main Content -->
        <div id="container" class="hidden max-w-7xl mx-auto p-6 space-y-12">
          <!-- General -->
          <section id="general">
            <h2 class="text-4xl font-bold text-center mb-4">General AI</h2>
            <div
              id="generalPurposeAI"
              class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"
            ></div>
          </section>

          <!-- Writing -->
          <section id="writing">
            <h2 class="text-4xl font-bold text-center mb-4">Writing Tools</h2>
            <div
              id="writingEditing"
              class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"
            ></div>
          </section>

          <!-- Coding -->
          <section id="coding">
            <h2 class="text-4xl font-bold text-center mb-4">Coding AI</h2>
            <div
              id="codingDevelopment"
              class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"
            ></div>
          </section>

          <!-- Image -->
          <section id="image">
            <h2 class="text-4xl font-bold text-center mb-4">Image AI</h2>
            <div
              id="imageDesign"
              class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"
            ></div>
          </section>

          <!-- Video -->
          <section id="video">
            <h2 class="text-4xl font-bold text-center mb-4">
              Video & Audio Tools
            </h2>
            <div
              id="videoAudio"
              class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"
            ></div>
          </section>

          <!-- Research -->
          <section id="research">
            <h2 class="text-4xl font-bold text-center mb-4">
              Research & Knowledge
            </h2>
            <div
              id="researchKnowledge"
              class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"
            ></div>
          </section>

          <!-- Productivity -->
          <section id="productivity">
            <h2 class="text-4xl font-bold text-center mb-4">
              Business & Productivity
            </h2>
            <div
              id="productivityBusiness"
              class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"
            ></div>
          </section>
        </div>

        <!-- Scroll to Top Button -->
        <button
          onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
          class="fixed bottom-6 right-6 bg-white p-2 rounded-full shadow hover:scale-110 transition"
        >
          <img
            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.sozQlq0jkhsUvnaoScA0yQHaHa%3Fpid%3DApi&f=1&ipt=2cb93dc6ad882ca3162bedfba3781fca4132fd374fe1bda415a0e414ca92051e"
            alt="Scroll to top"
            class="w-10 h-10 object-contain"
          />
        </button>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white text-center py-6 mt-10">
      <p class="text-sm">© 2026 AI Tools Hub. All rights reserved.</p>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
